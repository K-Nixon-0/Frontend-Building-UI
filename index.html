<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>Book & Notes</title>
        <link rel="stylessheet" href="styles/style.css">
        <script type="module" src="scripts/ui.js"></script>
    </head>

    <body>
        <a href="#main" styles="position:absolute;left:-9999px;">Skip to content</a>
        <header>
            <h1>Book & Notes</h1>
            <nav>
                <input type="search" id="search" placeholder="Search ...">
                <select id="sort">
                    <option value="">Sort by ...</option>
                    <option value="title">Titlle (A-Z)</option>
                    <option value="pages">Pages</option>
                    <option value="date">Date Added</option>
                </select>
            </nav>
        </header>

        <main id="main">
            <section>
                <h2>Add Entry</h2>
                <form id="vaultForm">
                    <input type="text" placeholder="Title" required>
                    <input type="text" placeholder="Author" required>
                    <input type="number" placeholder="Pages" required>
                    <input type="text" placeholder="Tag" required>
                    <input type="date" required>
                    <button type="submit">Save</button>
                </form>

                <div style="margin-top: 1rem;">
                    <button id="exportBtn">Export JSON</button>
                    <input type="file" id="importFile" accept=".json">
                </div>
            </section>

            <section>
                <h2>Dashboard & Catalog</h2>
                <div id="liveMsg" style="margin-bottom: 0.5rem;font-weight: bold;"></div>
                <p>Total Books: <span id="statTotal">0</span> | Total Pages: <span id="statPages">0</span></p>
                
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Pages</th>
                            <th>Tag</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="vaultTable"></tbody>
                </table>
            </section>
        </main>

        <footer>
            <p>Book & Notes Vault | Contact: <a>GitHub</a> | <a>Email</a></p>
        </footer>
    </body>
</html>
